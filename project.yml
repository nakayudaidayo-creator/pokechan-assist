name: PokeChanAssist
options:
  bundleIdPrefix: jp.local
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1"
targets:
  PokeChanAssist:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/**"
      - Shared
      - path: App/Resources
        buildPhase: resources
      - path: Data/party.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.local.pokechanassist
        PRODUCT_NAME: PokeChanAssist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ポケチャン補助
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSLocalNetworkUsageDescription: 画面録画の拡張機能から読み取り結果を受け取るために使います
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.jp.local.pokechanassist
    dependencies:
      - target: Broadcast
        embed: true
  Broadcast:
    type: app-extension
    platform: iOS
    sources:
      - Broadcast
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.local.pokechanassist.Broadcast
        PRODUCT_NAME: Broadcast
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: ポケチャン補助 読み取り
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Broadcast/Broadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.jp.local.pokechanassist
